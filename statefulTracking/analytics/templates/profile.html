<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Analytics Profiles</title>
    <style>body { font-family: Arial; max-width: 1100px; margin: 35px auto; } table { border-collapse: collapse; width:100%; } td,th { border:1px solid #aaa; padding:7px; text-align:left; }</style>
</head>
<body>
    <h1>Analytics events</h1>
    <p>Group rows by analytics ID. Different publisher domains normally have different IDs.</p>
    <table>
        <tr><th>Time</th><th>Analytics ID</th><th>Publisher</th><th>Page</th><th>Cookie header received</th><th>Referer</th></tr>
        {% for e in events %}
        <tr><td>{{ e.time }}</td><td>{{ e.analytics_id }}</td><td>{{ e.publisher }}</td><td>{{ e.page }}</td><td>{{ e.cookie_header }}</td><td>{{ e.referer }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
